    <title>Правовое обечпечение проф. деятельности</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            line-height: 1.4;
            padding: 10px;
            max-width: 448px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            padding: 5px;
        }
        
        .questions-list {
            margin-top: 5px;
        }
        
        .question-item {
            background-color: #1c1c1e;
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            border-left: 4px solid #0a84ff;
        }
        
        .question-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .question-title {
            font-size: 16px;
            font-weight: 500;
            flex: 1;
        }
        
        .toggle-icon {
            color: #0a84ff;
            font-size: 18px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }
        
        .answer-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background-color: #2c2c2e;
        }
        
        .answer-text {
            padding: 15px;
            font-size: 15px;
            color: #ddd;
            border-top: 1px solid #333;
            white-space: normal;
            overflow-wrap: break-word;
        }
        
        .question-item.active .toggle-icon {
            transform: rotate(180deg);
        }
        
        .question-item.active .answer-content {
            max-height: 2000px; /* Увеличил для полного отображения ответов */
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        
        .control-btn {
            background-color: #333;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        
        /* Адаптация для очень маленьких экранов */
        @media (max-width: 400px) {
            body {
                padding: 8px;
            }
            
            .question-header {
                padding: 12px;
            }
            
            .question-title {
                font-size: 15px;
            }
            
            .answer-text {
                padding: 12px;
                font-size: 14px;
            }
            
            .control-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
        
        /* Темная тема по умолчанию */
        @media (prefers-color-scheme: light) {
            body {
                background-color: #f2f2f7;
                color: #000;
            }
            
            .question-item {
                background-color: #fff;
                border-left-color: #007aff;
            }
            
            .answer-content {
                background-color: #f2f2f7;
                border-top-color: #c7c7cc;
            }
            
            .answer-text {
                color: #333;
            }
            
            .control-btn {
                background-color: #e5e5ea;
                color: #000;
            }
        }
    </style>
</head>

        // Состояние приложения
        let openQuestions = new Set();
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const questionsContainer = document.getElementById('questions-container');
            const collapseAllButton = document.getElementById('collapse-all');
            
            // Генерируем вопросы на странице
            questionsData.forEach(q => {
                const questionElement = document.createElement('div');
                questionElement.className = 'question-item';
                questionElement.id = `question-${q.id}`;
                
                questionElement.innerHTML = `
                    <div class="question-header" data-id="${q.id}">
                        <div class="question-title">${q.question}</div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="answer-content">
                        <div class="answer-text">${q.answer}</div>
                    </div>
                `;
                
                questionsContainer.appendChild(questionElement);
            });
            
            // Обработчик клика по вопросу
            document.querySelectorAll('.question-header').forEach(header => {
                header.addEventListener('click', function() {
                    const questionId = parseInt(this.getAttribute('data-id'));
                    const questionElement = document.getElementById(`question-${questionId}`);
                    
                    // Переключаем состояние вопроса
                    if (openQuestions.has(questionId)) {
                        openQuestions.delete(questionId);
                        questionElement.classList.remove('active');
                    } else {
                        openQuestions.add(questionId);
                        questionElement.classList.add('active');
                        
                        // Прокручиваем к открытому вопросу
                        questionElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });
            
            // Обработчик кнопки "Свернуть все"
            collapseAllButton.addEventListener('click', function() {
                document.querySelectorAll('.question-item.active').forEach(item => {
                    item.classList.remove('active');
                });
                openQuestions.clear();
            });
            
            // Добавляем обработчик для свайпов (для удобства на часах)
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;
                
                // Свайп влево (следующий вопрос)
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        // Свайп влево - открываем следующий вопрос
                        const allQuestions = Array.from(document.querySelectorAll('.question-item'));
                        const firstClosed = allQuestions.find(q => !q.classList.contains('active'));
                        
                        if (firstClosed) {
                            const questionId = parseInt(firstClosed.id.split('-')[1]);
                            firstClosed.classList.add('active');
                            openQuestions.add(questionId);
                            firstClosed.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }
                }
            }
        });
    </script>
